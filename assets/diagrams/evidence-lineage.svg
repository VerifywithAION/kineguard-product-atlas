<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Evidence must follow the exact request</title><desc id="desc">One wallet cannot inherit another wallet policy or receipt</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#d7b66a" stroke-width="1.4"/></marker></defs><rect width="1200" height="320" rx="24" fill="#0e1713"/><text x="36" y="61" fill="#f0f5ef" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Evidence must follow the exact request</text><text x="36" y="93" fill="#aac0b0" font-family="Segoe UI,Arial,sans-serif" font-size="17">One wallet cannot inherit another wallet policy or receipt</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="36.0" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="50.0" y="169" fill="#7bdca3" font-weight="700" font-size="16">IDENTITY</text><text x="50.0" y="194" dy="0" fill="#c6d5ca" font-size="15">Account + wallet +</text><text x="50.0" y="194" dy="22" fill="#c6d5ca" font-size="15">chain</text><path d="M250.2,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="265.2" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="279.2" y="169" fill="#dfc17b" font-weight="700" font-size="16">REQUEST</text><text x="279.2" y="194" dy="0" fill="#c6d5ca" font-size="15">Provider + origin +</text><text x="279.2" y="194" dy="22" fill="#c6d5ca" font-size="15">nonce</text><path d="M479.4,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="494.4" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="508.4" y="169" fill="#7bdca3" font-weight="700" font-size="16">POLICY</text><text x="508.4" y="194" dy="0" fill="#c6d5ca" font-size="15">Revision and hash</text><path d="M708.6,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="723.6" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="737.6" y="169" fill="#dfc17b" font-weight="700" font-size="16">DECISION</text><text x="737.6" y="194" dy="0" fill="#c6d5ca" font-size="15">Allow / warn / deny</text><path d="M937.8,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="952.8" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="966.8" y="169" fill="#7bdca3" font-weight="700" font-size="16">RESULT</text><text x="966.8" y="194" dy="0" fill="#c6d5ca" font-size="15">Forward status /</text><text x="966.8" y="194" dy="22" fill="#c6d5ca" font-size="15">receipt</text></g><text x="36" y="298" fill="#80998a" font-family="Segoe UI,Arial,sans-serif" font-size="14">CONCEPTUAL DOCUMENTATION — scope is specified in the accompanying evidence ledger</text></svg>
