<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Recursive governance: harden versus weaken</title><desc id="desc">A policy change is itself a governed action</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#d7b66a" stroke-width="1.4"/></marker></defs><rect width="1200" height="320" rx="24" fill="#0e1713"/><text x="36" y="61" fill="#f0f5ef" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Recursive governance: harden versus weaken</text><text x="36" y="93" fill="#aac0b0" font-family="Segoe UI,Arial,sans-serif" font-size="17">A policy change is itself a governed action</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="36.0" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="50.0" y="169" fill="#7bdca3" font-weight="700" font-size="16">CURRENT</text><text x="50.0" y="194" dy="0" fill="#c6d5ca" font-size="15">Effective rules</text><path d="M250.2,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="265.2" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="279.2" y="169" fill="#dfc17b" font-weight="700" font-size="16">PROPOSAL</text><text x="279.2" y="194" dy="0" fill="#c6d5ca" font-size="15">Harden or weaken</text><path d="M479.4,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="494.4" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="508.4" y="169" fill="#7bdca3" font-weight="700" font-size="16">DELAY</text><text x="508.4" y="194" dy="0" fill="#c6d5ca" font-size="15">Weaken stays pending</text><path d="M708.6,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="723.6" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="737.6" y="169" fill="#dfc17b" font-weight="700" font-size="16">REVIEW</text><text x="737.6" y="194" dy="0" fill="#c6d5ca" font-size="15">Cancel / safety veto</text><path d="M937.8,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="952.8" y="137" width="211.2" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="966.8" y="169" fill="#7bdca3" font-weight="700" font-size="16">MATURITY</text><text x="966.8" y="194" dy="0" fill="#c6d5ca" font-size="15">Apply only if valid</text></g><text x="36" y="298" fill="#80998a" font-family="Segoe UI,Arial,sans-serif" font-size="14">CONCEPTUAL DOCUMENTATION — scope is specified in the accompanying evidence ledger</text></svg>
