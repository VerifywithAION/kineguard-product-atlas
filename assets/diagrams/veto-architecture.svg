<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Three distinct veto mechanisms</title><desc id="desc">Browser DENY, human Cancel and V3 Safety Authority are not synonyms</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#d7b66a" stroke-width="1.4"/></marker></defs><rect width="1200" height="320" rx="24" fill="#0e1713"/><text x="36" y="61" fill="#f0f5ef" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Three distinct veto mechanisms</text><text x="36" y="93" fill="#aac0b0" font-family="Segoe UI,Arial,sans-serif" font-size="17">Browser DENY, human Cancel and V3 Safety Authority are not synonyms</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="36.0" y="137" width="364.0" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="50.0" y="169" fill="#7bdca3" font-weight="700" font-size="18">BROWSER DENY</text><text x="50.0" y="194" dy="0" fill="#c6d5ca" font-size="16">0 forwarding in tested path</text><path d="M403.0,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="418.0" y="137" width="364.0" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="432.0" y="169" fill="#dfc17b" font-weight="700" font-size="18">HUMAN CANCEL</text><text x="432.0" y="194" dy="0" fill="#c6d5ca" font-size="16">Stops held request</text><path d="M785.0,199 h12" stroke="#d7b66a" stroke-width="2" marker-end="url(#arrow)"/><rect x="800.0" y="137" width="364.0" height="120" rx="10" fill="#15251f" stroke="#345344" stroke-width="2" /><text x="814.0" y="169" fill="#7bdca3" font-weight="700" font-size="18">SAFETY VETO</text><text x="814.0" y="194" dy="0" fill="#c6d5ca" font-size="16">Exact pending V3 action</text></g><text x="36" y="298" fill="#80998a" font-family="Segoe UI,Arial,sans-serif" font-size="14">CONCEPTUAL DOCUMENTATION — scope is specified in the accompanying evidence ledger</text></svg>
